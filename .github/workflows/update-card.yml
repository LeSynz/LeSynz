name: Update profile card

on:
  schedule:
    # Off-the-hour: GitHub queues scheduled jobs heavily at :00.
    - cron: "17 3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - config.json
      - assets/ascii-art.txt
      - scripts/**
      - .github/workflows/update-card.yml

concurrency:
  group: profile-card
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render card
        run: node scripts/generate-card.js
        env:
          # PAT with repo + read:user. The built-in GITHUB_TOKEN only reaches
          # this one repo, and the line counter has to clone all of them.
          GH_TOKEN: ${{ secrets.CARD_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/profile-card.svg generated/loc-cache.json
          git diff --staged --quiet || git commit -m "chore: update profile card"
          git push
